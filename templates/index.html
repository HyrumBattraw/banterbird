<!DOCTYPE html>
<html>
<head>
    <title>Banterbird</title>
    <script src="/static/js/app.js" defer></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Image at the top -->
    <img src="https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-0904-61f7-a826-b5a2af6d17fe/raw?se=2025-04-25T15%3A47%3A34Z&sp=r&sv=2024-08-04&sr=b&scid=04e9f5ef-e153-50f9-abf8-6dd98382993b&skoid=0abefe37-d2bd-4fcb-bc88-32bccbef6f7d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2025-04-25T14%3A11%3A10Z&ske=2025-04-26T14%3A11%3A10Z&sks=b&skv=2024-08-04&sig=hMJ23N47jJpkm/tqaYi8Rk49P/IdMP2dXNa4pgUhjVs%3D" alt="Top Image" class="top-image">

    <h1>Banterbird</h1>
    <div>
        Logged in as: <strong id="username">admin</strong>
    </div>
    <div>
        <h3>New Post</h3>
        <textarea id="postInput" placeholder="What's on your mind?"></textarea><br>
        <button onclick="submitPost()">Tweet</button>
    </div>
    <hr>
    <h3>Feed</h3>
    <div id="feed"></div>

    <template id="post-template">
        <div class="post">
            <p><strong class="username"></strong>: <span class="message"></span></p>
            <small class="timestamp"></small>
            <hr>
        </div>
    </template>
</body>
</html>
